[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "l-carnosine-computational-workflow"
version = "0.1.0"
description = "Python tools for reproducible ORCA-based computational workflows and vibrational analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orca-summary = "carnosine_workflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "matplotlib>=3.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
